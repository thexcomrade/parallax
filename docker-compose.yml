services:
  nginx:
    image: nginx:alpine
    container_name: parallax-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./monitoring/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: parallax-api:latest
    container_name: parallax-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - PROCESS_ROLE=api
      - SERVE_FRONTEND=false
      - METRICS_ENABLED=true
      - LOG_FORMAT=json
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://parallax:parallax_secure_pass_2026@postgres:5432/parallax}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - STORAGE_DIR=/app/storage
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-parallax-media}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-parallax_minio}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minio_secure_pass_2026}
    command: ["sh", "-c", "alembic -c backend/alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir backend"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - parallax_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: parallax-worker:latest
    container_name: parallax-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - PROCESS_ROLE=worker
      - WORKER_MAX_CONCURRENCY=1
      - REQUIRE_GPU=${REQUIRE_GPU:-true}
      - INFERENCE_DEVICE=${INFERENCE_DEVICE:-cuda:0}
      - LOG_FORMAT=json
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://parallax:parallax_secure_pass_2026@postgres:5432/parallax}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - STORAGE_DIR=/app/storage
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-parallax-media}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-parallax_minio}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minio_secure_pass_2026}
    command: ["python", "-m", "app.workers.inference_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - parallax_storage:/app/storage
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  postgres:
    image: postgres:16-alpine
    container_name: parallax-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-parallax}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-parallax_secure_pass_2026}
      - POSTGRES_DB=${POSTGRES_DB:-parallax}
    ports:
      - "5432:5432"
    volumes:
      - parallax_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parallax -d parallax"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: parallax-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - parallax_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: parallax-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-parallax_minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minio_secure_pass_2026}
    volumes:
      - parallax_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional Observability & Monitoring Services (Active with --profile monitoring)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: parallax-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - parallax_prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      api:
        condition: service_healthy

  grafana:
    image: grafana/grafana:10.4.0
    container_name: parallax-grafana
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-parallax_grafana_2026}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - parallax_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  parallax_storage:
    driver: local
  parallax_postgres_data:
    driver: local
  parallax_redis_data:
    driver: local
  parallax_minio_data:
    driver: local
  parallax_prometheus_data:
    driver: local
  parallax_grafana_data:
    driver: local
