services:
  parallax:
    build:
      context: .
      dockerfile: Dockerfile
    image: parallax:latest
    container_name: parallax-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:////app/storage/parallax.db
      - STORAGE_DIR=/app/storage
    volumes:
      - parallax_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  parallax_storage:
    driver: local
