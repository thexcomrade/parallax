[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallax-backend"
version = "1.1.0"
description = "PARALLAX Audio-Visual Deepfake Forensics Backend"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.20",
    "httpx>=0.28.0",
    "defusedxml>=0.7.1",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "torchaudio>=2.2.0",
    "timm>=1.0.12",
    "librosa>=0.10.2",
    "opencv-python-headless>=4.10.0,<5.0.0",
    "numpy>=1.26.0",
    "pillow>=10.4.0",
    "scikit-learn>=1.4.0",
    "psycopg[binary]>=3.2.0",
    "redis>=5.2.0",
    "boto3>=1.36.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "types-requests>=2.32.0",
    "types-PyYAML>=6.0.12",
    "fakeredis>=2.26.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "training*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = ["B008"]  # FastAPI Depends() in function signatures is idiomatic

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "slowapi.*",
    "timm.*",
    "librosa.*",
    "cv2.*",
    "scipy.*",
    "torchaudio.*",
    "defusedxml.*",
    "mediapipe.*",
    "soundfile",
    "soundfile.*",
    "yaml.*",
    "sklearn.*",
    "boto3",
    "boto3.*",
    "botocore",
    "botocore.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
