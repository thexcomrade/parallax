# PARALLAX — Production Edge Origin / CDN Simulator Configuration
# Compatible with AWS CloudFront, Cloudflare, and Standalone Docker Deployments

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured JSON log format for ingestion into monitoring stacks
    log_format json_combined escape=json
      '{"timestamp":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"request_method":"$request_method",'
      '"request_uri":"$request_uri",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent",'
      '"x_request_id":"$http_x_request_id"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression for text and SVG
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    upstream parallax_api {
        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Global Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.dicebear.com; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

        # 1. Content-Hashed Static Assets (Vite Chunks, CSS, WOFF2 Fonts)
        # Aggressive 1-year immutable cache policy
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # 2. Favicons, robots.txt, sitemap.xml
        location ~* \.(ico|txt|xml)$ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
            access_log off;
            try_files $uri =404;
        }

        # 3. Dynamic REST API & Durable SSE Streaming
        # Strict NO-STORE policy to prevent CDN caching of private forensic media and auth
        location /api/ {
            proxy_pass http://parallax_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;

            # SSE Streaming support (disable proxy buffering)
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Ensure CDN/Edge never caches API responses
            add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # 4. Health & Liveness Probes
        location ~ ^/(health|health/liveness|health/readiness) {
            proxy_pass http://parallax_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # 5. Internal Prometheus Metrics (Restricted from Public Access)
        location /metrics {
            # In production, restrict to internal scraper subnets
            # allow 10.0.0.0/8;
            # allow 172.16.0.0/12;
            # allow 192.168.0.0/16;
            # deny all;

            proxy_pass http://parallax_api/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 6. SPA Client-Side Routing Fallback
        # Any non-file route falls back to index.html with no-cache validation
        location / {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
