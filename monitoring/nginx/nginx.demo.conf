# PARALLAX — Cloudflare Quick Tunnel Demo Reverse Proxy Configuration
# Binds to 127.0.0.1:8080 and proxies to internal Docker microservices

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Structured JSON log format for ingestion and tunnel diagnostics
    log_format json_combined escape=json
      '{"timestamp":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"request_method":"$request_method",'
      '"request_uri":"$request_uri",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"http_referrer":"$http_referer",'
      '"http_user_agent":"$http_user_agent",'
      '"x_request_id":"$http_x_request_id"}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Cloudflare Free Quick Tunnel Safe Upload Ceiling (90MB)
    client_max_body_size 90m;

    # Gzip Compression for text and SVG assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    upstream parallax_api {
        server staging-api:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Global Security Headers (Zero Trust & Browser Hardening)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://api.dicebear.com blob:; font-src 'self'; connect-src 'self' blob:; frame-ancestors 'none';" always;

        # 1. Content-Hashed Static Assets (Vite Chunks, CSS, WOFF2 Fonts)
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # 2. Favicons, robots.txt, sitemap.xml
        location ~* \.(ico|txt|xml|svg)$ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
            access_log off;
            try_files $uri =404;
        }

        # 3. Dynamic REST API & Dual-Mode Telemetry (SSE + Polling)
        location /api/ {
            proxy_pass http://parallax_api;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;

            # SSE Streaming support & Polling buffering bypass
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Ensure CDN/Edge never caches API responses
            add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
        }

        # 4. Health & Liveness Probes
        location ~ ^/(health|health/liveness|health/readiness) {
            proxy_pass http://parallax_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }

        # 5. SPA Client-Side Routing Fallback
        location / {
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
